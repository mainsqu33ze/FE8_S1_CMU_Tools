<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FE8 Boss Growth Randomizer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #eee; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 15px; border: 1px solid #333; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #00d4ff; text-align: center; font-size: 1.5em; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #00d4ff; font-weight: bold; font-size: 0.9em; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; font-size: 1rem; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 12px; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-gen { background: linear-gradient(135deg, #00d4ff, #005f7a); color: white; }
        .btn-print { background: #444; color: white; display: none; }
        button:hover { transform: scale(1.01); filter: brightness(1.1); }

        #output { margin-top: 20px; padding-top: 20px; border-top: 1px solid #333; display: none; }
        .stat-line { display: flex; justify-content: space-between; background: #252525; margin: 4px 0; padding: 8px; border-radius: 4px; border-left: 3px solid #00d4ff; }
        #outHeader { font-size: 1.4em; font-weight: bold; color: #ffcc00; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>FE8 Boss Growth Randomizer</h1>
    
    <div class="input-group">
        <label for="bossName">Boss Name:</label>
        <input type="text" id="bossName" placeholder="Enter boss name (e.g. Vigarde, Binks)...">
    </div>

    <div class="input-group">
        <label for="totalPool">Total Growth Rate Pool:</label>
        <input type="number" id="totalPool" value="307">
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="randomizePool" onchange="togglePoolInput()">
        <label for="randomizePool" style="margin-bottom:0; cursor:pointer;">Randomize Pool Total (250 Saleh - 580 Myrrh)</label>
    </div>

    <div class="button-group">
        <button class="btn-gen" onclick="generate()">GENERATE GROWTHS</button>
        <button id="printBtn" class="btn-print" onclick="downloadTxt()">PRINT TO .TXT</button>
    </div>

    <div id="output">
        <div id="outHeader"></div>
        <div id="outMeta" style="margin-bottom: 15px; color: #aaa;"></div>
        <div id="outGrowths"></div>
    </div>
</div>

<script>
let lastGenerated = null;

function togglePoolInput() {
    const isChecked = document.getElementById('randomizePool').checked;
    const poolInput = document.getElementById('totalPool');
    poolInput.disabled = isChecked;
    poolInput.style.opacity = isChecked ? '0.5' : '1';
}

function generate() {
    const nameInput = document.getElementById('bossName').value.trim();
    const bossName = nameInput !== "" ? nameInput : "Unnamed Boss";
    
    let targetPool;
    const randomizeChecked = document.getElementById('randomizePool').checked;
    
    if (randomizeChecked) {
        // Random pool between 250 and 580 (inclusive)
        targetPool = Math.floor(Math.random() * (580 - 250 + 1)) + 250;
    } else {
        targetPool = parseInt(document.getElementById('totalPool').value) || 300;
    }

    const growthKeys = ["HP", "PWR", "SKL", "SPD", "LCK", "DEF", "RES"];
    let growths = { HP: 0, PWR: 0, SKL: 0, SPD: 0, LCK: 0, DEF: 0, RES: 0 };

    // Distribute pool in 5% increments, ensuring individual stats range from 0 to 255
    let remainingPool = targetPool;
    // Normalize or allocate chunks
    let iterations = Math.round(targetPool / 5);
    
    for(let i = 0; i < iterations; i++) {
        let randomKey = growthKeys[Math.floor(Math.random() * growthKeys.length)];
        if (growths[randomKey] + 5 <= 255) {
            growths[randomKey] += 5;
        } else {
            // Find another stat that can take it if maxed out at 255
            let availableKeys = growthKeys.filter(k => growths[k] <= 250);
            if(availableKeys.length > 0) {
                let fallbackKey = availableKeys[Math.floor(Math.random() * availableKeys.length)];
                growths[fallbackKey] += 5;
            }
        }
    }

    let actualTotal = Object.values(growths).reduce((a, b) => a + b, 0);

    lastGenerated = { bossName, targetPool: actualTotal, growths };

    // Display
    document.getElementById('outHeader').innerText = `Boss: ${bossName}`;
    document.getElementById('outMeta').innerText = `Total Growth Pool: ${actualTotal}%`;

    let growthHtml = "";
    growthKeys.forEach(k => {
        growthHtml += `<div class="stat-line"><span>${k} Growth</span><span>${growths[k]}%</span></div>`;
    });
    
    document.getElementById('outGrowths').innerHTML = growthHtml;
    document.getElementById('output').style.display = "block";
    document.getElementById('printBtn').style.display = "block";
}

function downloadTxt() {
    if(!lastGenerated) return;
    const d = lastGenerated;
    
    const content = `FE8 BOSS GROWTH RANDOMIZER OUTPUT
Boss Name: ${d.bossName}
Total Growth Pool: ${d.targetPool}%

Growths:
HP: ${d.growths.HP}%
PWR: ${d.growths.PWR}%
SKL: ${d.growths.SKL}%
SPD: ${d.growths.SPD}%
LCK: ${d.growths.LCK}%
DEF: ${d.growths.DEF}%
RES: ${d.growths.RES}%`;

    const blob = new Blob([content], { type: 'text/plain' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${d.bossName.replace(/\s+/g, '_')}_growths.txt`;
    a.click();
    window.URL.revokeObjectURL(url);
}
</script>
</body>
</html>
