<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mainsqu33ze CMU Tracker - Hotkey Edition</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --primary: #00d4ff;
            --accent: #ffcc00;
            --danger: #dc3545;
            --success: #28a745;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-dark); 
            color: #eee; 
            padding: 20px;
            margin: 0;
        }

        .container { 
            max-width: 1400px; 
            margin: auto; 
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        h1 { color: var(--primary); margin: 0; text-transform: uppercase; letter-spacing: 2px; }

        /* Hotkey Legend Banner */
        .hotkey-legend {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85em;
            color: #aaa;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .hotkey-legend span b {
            color: var(--primary);
            background: #252525;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        /* Grid System */
        .unit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Card Styling */
        .unit-card {
            background: var(--card-bg);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .unit-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            background: #22252a;
        }

        .unit-card:hover {
            border-color: #555;
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .unit-name-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hotkey-badge {
            background: #333;
            color: var(--accent);
            font-size: 0.75em;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
        }

        .unit-name {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--accent);
        }

        .accuracy-badge {
            font-size: 0.9em;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            background: #252525;
        }

        /* Button Layout within Cards */
        .stats-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .label {
            font-size: 0.7em;
            text-transform: uppercase;
            color: #888;
            margin-left: 2px;
        }

        button { 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            transition: 0.1s; 
            padding: 10px;
            color: white;
            font-size: 1em;
        }

        button:active { transform: scale(0.95); }

        .btn-stat { background: #333; border: 1px solid #444; }
        .btn-stat:hover { background: #444; }

        .btn-hit { border-left: 4px solid var(--primary); }
        .btn-miss { border-left: 4px solid #555; }
        .btn-crit { border-left: 4px solid #f39c12; }
        .btn-kill { border-left: 4px solid var(--danger); }
        .btn-evade { border-left: 4px solid #6a1b9a; }
        .btn-death { border-left: 4px solid var(--success); }

        /* Global Controls */
        .controls-top { margin-bottom: 20px; display: flex; gap: 10px; }
        .btn-main { background: var(--primary); color: #000; padding: 12px 24px; font-size: 1em; }
        .btn-export { background: #555; color: #fff; }
        .btn-clear { background: var(--danger); font-size: 0.8em; margin-left: auto; }

        .remove-unit {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--danger);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            visibility: hidden;
            z-index: 10;
        }

        .unit-card:hover .remove-unit { visibility: visible; }

        @media (max-width: 600px) {
            .unit-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Combat Performance Tracker</h1>
        <button class="btn-clear" onclick="clearData()">WIPE DATA</button>
    </header>

    <div class="hotkey-legend">
        <span>Select Unit: <b>1 - 9</b></span>
        <span><b>Q</b>: Hit</span>
        <span><b>A</b>: Miss</span>
        <span><b>W</b>: Crit</span>
        <span><b>S</b>: Kill</span>
        <span><b>E</b>: Evade</span>
        <span><b>D</b>: Bonk</span>
        <span><b>F</b>: Death</span>
        <span style="margin-left:auto; color:#ffcc00;">💡 Tip: Left-click card or press number to target. Right-click buttons to subtract.</span>
    </div>
    
    <div class="controls-top">
        <button class="btn-main" onclick="addUnit()">+ ADD UNIT</button>
        <button class="btn-main btn-export" onclick="exportCSV()">EXPORT CSV</button>
    </div>

    <div id="unitGrid" class="unit-grid"></div>
</div>

<script>
    let units = JSON.parse(localStorage.getItem('cmu_data')) || [];
    let activeUnitIndex = 0;

    function save() {
        localStorage.setItem('cmu_data', JSON.stringify(units));
        render();
    }

    function addUnit() {
        const name = prompt("Unit Name:");
        if (!name) return;
        units.push({
            name: name,
            hit: 0,
            miss: 0,
            crit: 0,
            bonked: 0,
            kills: 0,
            evaded: 0,
            death: 0
        });
        activeUnitIndex = units.length - 1;
        save();
    }

    function handleUpdate(e, index, key, amount = 1) {
        if (e) e.preventDefault();
        units[index][key] = Math.max(0, units[index][key] + amount);
        save();
    }

    function setActiveUnit(index) {
        if (index < units.length) {
            activeUnitIndex = index;
            render();
        }
    }

    // Global Keyboard Listener for Hotkeys
    window.addEventListener('keydown', (e) => {
        // Ignore if user is typing inside an input/prompt
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

        const key = e.key.toLowerCase();

        // Number keys 1-9 to select units
        if (!isNaN(e.key) && e.key >= '1' && e.key <= '9') {
            const unitIdx = parseInt(e.key) - 1;
            setActiveUnit(unitIdx);
            return;
        }

        // Action hotkeys applied to the currently active unit
        if (units.length === 0) return;
        const targetIdx = Math.min(activeUnitIndex, units.length - 1);
        const amount = e.shiftKey ? -1 : 1; // Hold Shift + key to subtract

        if (key === 'q') handleUpdate(null, targetIdx, 'hit', amount);
        if (key === 'a') handleUpdate(null, targetIdx, 'miss', amount);
        if (key === 'w') handleUpdate(null, targetIdx, 'crit', amount);
        if (key === 's') handleUpdate(null, targetIdx, 'kills', amount);
        if (key === 'e') handleUpdate(null, targetIdx, 'evaded', amount);
        if (key === 'd') handleUpdate(null, targetIdx, 'bonked', amount);
        if (key === 'f') handleUpdate(null, targetIdx, 'death', amount);
    });

    function removeUnit(index) {
        if (confirm(`Remove ${units[index].name}?`)) {
            units.splice(index, 1);
            if (activeUnitIndex >= units.length) activeUnitIndex = Math.max(0, units.length - 1);
            save();
        }
    }

    function clearData() {
        if (confirm("Permanently wipe all units?")) {
            units = [];
            activeUnitIndex = 0;
            save();
        }
    }

    function exportCSV() {
        if (units.length === 0) return alert("No data!");
        const headers = ["Unit", "Hit", "Miss", "Acc%", "Crit", "Bonked", "Kills", "Evaded", "Death"];
        const rows = units.map(u => {
            const total = u.hit + u.miss;
            const acc = (total > 0) ? Math.round((u.hit / total) * 100) : 0;
            return [u.name, u.hit, u.miss, acc + "%", u.crit, u.bonked, u.kills, u.evaded, u.death].join(",");
        });
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows].join("\n");
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", `FE_Stats_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function render() {
        const grid = document.getElementById('unitGrid');
        grid.innerHTML = "";
        
        units.forEach((u, i) => {
            const total = u.hit + u.miss;
            const acc = (total > 0) ? Math.round((u.hit / total) * 100) : 0;
            const accColor = acc > 80 ? '#28a745' : acc > 50 ? '#ffcc00' : '#dc3545';
            const isActive = (i === activeUnitIndex);

            const card = document.createElement('div');
            card.className = `unit-card ${isActive ? 'active' : ''}`;
            card.onclick = () => setActiveUnit(i);

            card.innerHTML = `
                <button class="remove-unit" onclick="event.stopPropagation(); removeUnit(${i})">✕</button>
                <div class="card-header">
                    <div class="unit-name-area">
                        <span class="hotkey-badge">${i + 1 < 10 ? i + 1 : '-'}</span>
                        <span class="unit-name">${u.name}</span>
                    </div>
                    <span class="accuracy-badge" style="color: ${accColor}">${acc}% ACC</span>
                </div>
                <div class="stats-controls">
                    <div class="stat-group">
                        <span class="label">Accuracy [Q / A]</span>
                        <button class="btn-stat btn-hit" onclick="event.stopPropagation(); handleUpdate(event, ${i}, 'hit')" oncontextmenu="handleUpdate(event, ${i}, 'hit')">HIT: ${u.hit}</button>
                        <button class="btn-stat btn-miss" onclick="event.stopPropagation(); handleUpdate(event, ${i}, 'miss')" oncontextmenu="handleUpdate(event, ${i}, 'miss')">MISS: ${u.miss}</button>
                    </div>
                    <div class="stat-group">
                        <span class="label">Combat [W / S]</span>
                        <button class="btn-stat btn-crit" onclick="event.stopPropagation(); handleUpdate(event, ${i}, 'crit')" oncontextmenu="handleUpdate(event, ${i}, 'crit')">CRIT: ${u.crit}</button>
                        <button class="btn-stat btn-kill" onclick="event.stopPropagation(); handleUpdate(event, ${i}, 'kills')" oncontextmenu="handleUpdate(event, ${i}, 'kills')">KILL: ${u.kills}</button>
                    </div>
                    <div class="stat-group">
                        <span class="label">Defense [E / D]</span>
                        <button class="btn-stat btn-evade" onclick="event.stopPropagation(); handleUpdate(event, ${i}, 'evaded')" oncontextmenu="handleUpdate(event, ${i}, 'evaded')">EVADE: ${u.evaded}</button>
                        <button class="btn-stat btn-stat" onclick="event.stopPropagation(); handleUpdate(event, ${i}, 'bonked')" oncontextmenu="handleUpdate(event, ${i}, 'bonked')">BONK: ${u.bonked}</button>
                    </div>
                    <div class="stat-group">
                        <span class="label">Deaths [F]</span>
                        <button class="btn-stat btn-death" onclick="event.stopPropagation(); handleUpdate(event, ${i}, 'death')" oncontextmenu="handleUpdate(event, ${i}, 'death')">DEATH: ${u.death}</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    render();
</script>

</body>
</html>
